name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_HOST: 72.60.196.229
  DEPLOY_USER: secretshare-deploy
  DEPLOY_PATH: /var/www/secretshare/privacy-lock

concurrency:
  group: secretshare-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Smoke test application
        run: |
          node server.mjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:3000/healthz && exit 0
            sleep 1
          done
          exit 1

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://secretshare.dev
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude '.data/' --exclude '.git/' \
            -e 'ssh -i ~/.ssh/deploy_key' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Start and verify release
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose up -d --build --remove-orphans && curl --fail --retry 12 --retry-delay 2 http://127.0.0.1:3010/healthz"
