name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate static site
        shell: bash
        run: |
          test -f index.html
          test -f privacy.html
          test -f resources.html
          test "$(find guides -maxdepth 1 -name '*.html' | wc -l)" -eq 10
          ! grep -R -E 'href="#"|ca-pub-[0-9]+|pagead2\.googlesyndication' --include='*.html' --include='*.js' .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
